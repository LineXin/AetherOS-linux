name: Build and publish AetherOS Live ISO
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag (example: v0.1.0)"
        required: true
        type: string
        default: "v0.1.0"
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build-and-release:
    name: Build XFCE and publish Release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install live-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin
      - name: Build and split XFCE Live ISO
        run: bash scripts/build.sh
      - name: Verify release payload
        run: |
          test -s output/SHA256SUMS
          test -n "$(find output -maxdepth 1 -name 'AetherOS-13.8.0-amd64-XFCE.iso.part-*' -print -quit)"
          while IFS= read -r part; do
            size=$(stat -c '%s' "$part")
            test "$size" -lt 2000000000
          done < <(find output -maxdepth 1 -name '*.part-*' -type f)
      - name: Prepare release description
        run: |
          cp RELEASE_NOTES.md output/RELEASE_NOTES.md
          {
            echo
            echo "## SHA256 checksums of reconstructed ISO files"
            echo
            echo "Checksums:"
            cat output/SHA256SUMS
          } >> output/RELEASE_NOTES.md
      - name: Publish ISO parts to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: AetherOS ${{ inputs.release_tag || github.ref_name }}
          body_path: output/RELEASE_NOTES.md
          files: |
            output/*.part-*
            output/SHA256SUMS
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
