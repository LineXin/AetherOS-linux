name: Build and publish AetherOS Live ISO
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag (example: v0.1.0)"
        required: true
        type: string
        default: "v0.1.0"
      desktop_environment:
        description: "Desktop environment to build"
        required: true
        type: choice
        default: "xfce"
        options:
          - xfce
          - gnome
      build_mode:
        description: "Build mode (fast_repack updates latest release; full_live_build builds from scratch)"
        required: true
        type: choice
        default: "fast_repack"
        options:
          - fast_repack
          - full_live_build
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build-and-release:
    name: Build ${{ inputs.desktop_environment || 'xfce' }} and publish Release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build and split Live ISO in Debian Trixie container
        env:
          AETHEROS_DE: ${{ inputs.desktop_environment || 'xfce' }}
          BUILD_MODE: ${{ inputs.build_mode || 'fast_repack' }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          SCRIPT="scripts/repack-latest.sh"
          if [ "$BUILD_MODE" = "full_live_build" ]; then
            SCRIPT="scripts/build.sh"
          fi
          docker run --rm --privileged \
            -e AETHEROS_DE="$AETHEROS_DE" \
            -e GH_TOKEN="$GH_TOKEN" \
            -e GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            debian:trixie \
            bash -c "apt-get update && apt-get install -y curl python3 live-build debootstrap squashfs-tools xorriso isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin rustc cargo libgtk-4-dev pkg-config && bash \"$SCRIPT\" \"\$AETHEROS_DE\""
          sudo chown -R "$(id -u):$(id -g)" output
      - name: Verify release payload
        run: |
          test -s output/SHA256SUMS
          test -n "$(find output -maxdepth 1 -name 'AetherOS-13.8.0-amd64-*.iso.part-*' -print -quit)"
          while IFS= read -r part; do
            size=$(stat -c '%s' "$part")
            test "$size" -lt 2000000000
          done < <(find output -maxdepth 1 -name '*.part-*' -type f)
      - name: Prepare release description
        run: |
          cp RELEASE_NOTES.md output/RELEASE_NOTES.md
          {
            echo
            echo "## SHA256 checksums of reconstructed ISO files"
            echo
            echo "Checksums:"
            cat output/SHA256SUMS
          } >> output/RELEASE_NOTES.md
      - name: Publish ISO parts to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: AetherOS ${{ inputs.release_tag || github.ref_name }}
          body_path: output/RELEASE_NOTES.md
          files: |
            output/*.part-*
            output/SHA256SUMS
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
