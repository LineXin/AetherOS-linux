name: Build and publish AetherOS Live ISO

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag (example: v0.1.0)"
        required: true
        type: string
        default: "v0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build XFCE + KDE and publish Release
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xorriso

      - name: Build both Live ISO editions
        run: bash scripts/build.sh

      - name: Verify release files
        run: |
          test -s output/AetherOS-13.8.0-amd64-XFCE.iso
          test -s output/AetherOS-13.8.0-amd64-KDE.iso
          sha256sum output/*.iso | tee output/SHA256SUMS

      - name: Prepare release description
        run: |
          cp RELEASE_NOTES.md output/RELEASE_NOTES.md
          {
            echo
            echo "## SHA256 checksums"
            echo
            echo 'text'
            cat output/SHA256SUMS
            echo 'text'
          } >> output/RELEASE_NOTES.md

      - name: Publish ISO files to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: AetherOS ${{ inputs.release_tag || github.ref_name }}
          body_path: output/RELEASE_NOTES.md
          files: |
            output/AetherOS-13.8.0-amd64-XFCE.iso
            output/AetherOS-13.8.0-amd64-KDE.iso
            output/SHA256SUMS
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
