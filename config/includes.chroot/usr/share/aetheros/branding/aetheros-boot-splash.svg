<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="55%" stop-color="#0e1320"/>
      <stop offset="100%" stop-color="#171420"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#ff713f" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#f04d38" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070a12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffad7a"/>
      <stop offset="100%" stop-color="#f04d38"/>
    </linearGradient>
    <linearGradient id="ridge1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d2433" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff713f" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff8a5c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff713f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- Subtle grid dots / stars -->
  <g fill="#ffffff" opacity="0.16">
    <circle cx="240" cy="140" r="1.5"/>
    <circle cx="460" cy="95" r="1"/>
    <circle cx="710" cy="180" r="1.5"/>
    <circle cx="1230" cy="130" r="1.5"/>
    <circle cx="1480" cy="85" r="1"/>
    <circle cx="1690" cy="190" r="1.5"/>
    <circle cx="310" cy="340" r="1"/>
    <circle cx="1610" cy="330" r="1"/>
  </g>

  <!-- Mountain silhouette at bottom -->
  <path d="M0 890 L220 790 L410 850 L640 740 L860 845 L1080 760 L1320 840 L1560 755 L1760 825 L1920 770 L1920 1080 L0 1080 Z" fill="url(#ridge1)"/>
  <path d="M0 950 L290 880 L540 945 L820 870 L1100 940 L1380 875 L1670 935 L1920 885 L1920 1080 L0 1080 Z" fill="#080b13"/>
  <path d="M0 950 Q480 910 960 948 T1920 930" fill="none" stroke="url(#horizon)" stroke-width="2.5"/>

  <!-- Central dark panel for crisp boot menu legibility -->
  <rect x="420" y="310" width="1080" height="510" rx="18" fill="#090d16" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- AetherOS Emblem (top center) -->
  <g transform="translate(960 155)" fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-linejoin="round">
    <circle r="76" stroke-width="7"/>
    <path d="M-44 46 L0 -48 L44 46 M-26 11 H26" stroke-width="9"/>
  </g>

  <!-- Wordmark -->
  <g font-family="DejaVu Sans, sans-serif" text-anchor="middle">
    <text x="960" y="275" fill="#f4f2f1" font-size="38" font-weight="bold" letter-spacing="14">AETHEROS</text>
  </g>

  <!-- Footer tagline -->
  <text x="960" y="1020" font-family="DejaVu Sans, sans-serif" text-anchor="middle" fill="#ff9a77" fill-opacity="0.85" font-size="18" letter-spacing="8">PURE. FAST. REFINED.</text>
</svg>
